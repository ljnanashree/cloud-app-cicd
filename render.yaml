# ==============================================================================
# Render Blueprint Specification (Infrastructure-as-Code)
# Deploys Flask Web Service + Managed PostgreSQL Cloud Database automatically
# ==============================================================================
services:
  # Web Application Service
  - type: web
    name: cloudpulse-web
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: APP_NAME
        value: CloudPulse
      - key: APP_VERSION
        value: 1.0.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cloudpulse-postgres
          property: connectionString

# Cloud Managed Database
databases:
  - name: cloudpulse-postgres
    region: oregon
    plan: free
    databaseName: cloudpulse_db
    user: cloudpulse_admin
