{% extends "base.html" %}

{% block title %}404 - Page Not Found | CloudPulse{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-card">
        <div class="error-badge">404 Error</div>
        <h1 class="error-title">Endpoint Not Found</h1>
        <p class="error-desc">The requested resource could not be located in this CloudPulse deployment.</p>
        <div class="error-actions">
            <a href="/" class="btn btn-primary">Return to Dashboard</a>
            <a href="/health" class="btn btn-outline">Check Health Status</a>
        </div>
    </div>
</div>
{% endblock %}
